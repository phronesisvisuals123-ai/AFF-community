<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080d0b"><title>AAF Admin</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&family=DM+Sans:wght@400;600;700&display=swap" rel="stylesheet"><style>
:root{--bg:#080d0b;--panel:#111a15;--green:#b7f34a;--muted:#9aa99d;--line:#29372d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f5f8f4;font-family:'DM Sans',sans-serif}header{padding:20px max(18px,calc((100% - 1000px)/2));border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px}.brand,h1,h2{font-family:'Barlow Condensed',sans-serif;text-transform:uppercase}.brand{font-size:25px;font-weight:900}.brand span,h1 em{color:var(--green);font-style:normal}a{color:var(--green);text-decoration:none}.wrap{max-width:1000px;margin:auto;padding:28px 18px}h1{font-size:clamp(40px,7vw,64px);margin:0}h2{font-size:27px;margin:0 0 15px}.sub{color:var(--muted)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.card{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:20px;margin:18px 0}.field{margin:12px 0}label{display:block;color:var(--muted);font-size:13px;margin-bottom:7px}input,textarea,select{width:100%;background:#080f0b;color:white;border:1px solid var(--line);border-radius:8px;padding:13px;font:inherit}textarea{min-height:135px}button{border:0;border-radius:8px;padding:12px 16px;background:var(--green);font-weight:800;cursor:pointer}.secondary{background:#17231b;color:white;border:1px solid var(--line)}.danger{background:#57251f;color:white}.status{padding:13px;border-radius:8px;background:#17231b;color:var(--muted);margin:15px 0}.error{color:#ffd0cc;border:1px solid #713b36}.item{padding:13px 0;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.item p{white-space:pre-wrap;overflow-wrap:anywhere}.item small{color:var(--muted)}.hidden{display:none!important}@media(max-width:700px){.grid{grid-template-columns:1fr}.item{flex-direction:column}}
</style></head><body><header><div class="brand"><span>AAF</span> ADMIN</div><nav><a href="./index.html">← Public website</a> <button id="signOut" class="secondary hidden">Sign out</button></nav></header><main class="wrap"><h1>Control <em>Room.</em></h1><p class="sub">Manage AAF news and community comments.</p><div id="status" class="status">Checking administrator access…</div><section id="dashboard" class="hidden"><div class="grid"><form id="newsForm" class="card"><h2>Publish football news</h2><div class="field"><label>Headline</label><input id="title" maxlength="120" required></div><div class="field"><label>Category</label><select id="category"><option>Breaking News</option><option>Premier League</option><option>La Liga</option><option>Serie A</option><option>Champions League</option><option>International</option><option>Transfer News</option><option>Other</option></select></div><div class="field"><label>Article / update</label><textarea id="body" maxlength="8000" required></textarea></div><div class="field"><label>Image URL (optional; https only)</label><input id="imageUrl" type="url" placeholder="https://..."></div><button id="publishBtn">PUBLISH NEWS ↗</button></form><section class="card"><h2>Recent news</h2><div id="postsList">Loading…</div></section></div><section class="card"><h2>Community comments</h2><div id="commentsList">Loading…</div></section></section></main><script type="module" src="./admin.js"></script></body></html>
